# gitleaks 設定
#
# 背景：2026/08/07 GitGuardian 通報本 repo 有 4 筆憑證外洩。確認後：
#   ・LINE Channel Access Token（2024/05）—— 真的
#   ・memos JWT（2024/06）—— 真的，exp 解出來是 2124 年，等同永不過期
#   ・Generic Password ×2 —— 誤報，是 docker-compose 的 `svra-dev-only` 佔位值
#
# 處置順序是刻意的：
#   1. 先重新發行憑證 —— 已公開兩年的字串靠改 code 收不回來，只有讓它失效才是止血
#   2. 再清歷史 —— git filter-repo 把兩筆憑證從所有 commit 抹除（日期與訊息保留）
#   3. 最後加防線 —— 就是這個檔案，讓同樣的事不會再發生
#
# 順序不能倒過來。先清 code 只是清理現場，憑證還活著的話一點用都沒有。

title = "SVRA gitleaks config"

[extend]
useDefault = true   # 沿用官方規則集，只加白名單，不放寬偵測

# ── 自訂規則：LINE Channel Access Token ───────────────────────────────
# 官方規則集沒有 LINE 的樣式，實測會直接放行 —— 而那正是 2024 年漏掉的那一個。
# 特徵：160 字元以上的 base64，結尾可能有 '='。
[[rules]]
id = "line-channel-access-token"
description = "LINE Channel Access Token"
regex = '''(?i)(line[_-]?(channel[_-]?)?access[_-]?token|Configuration\()\s*[=:(]\s*['"][A-Za-z0-9+/]{160,}={0,2}['"]'''
tags = ["line", "token"]

# ── 自訂規則：Google OAuth 憑證（決策 26 帶進來的） ──────────────────
# 行事曆的 refresh token 等同於「永久的行事曆讀寫權」，
# 外洩的嚴重度不比 LINE token 低。
#
# 🔴 **但這裡跟 LINE 那條的理由不一樣，而差別是量出來的。**
# 官方規則集<b>不是</b>完全放行——`generic-api-key` 抓得到，
# 條件是<b>旁邊要有關鍵字當線索</b>：
#
#   GOOGLE_REFRESH_TOKEN=1//0xxxx…    → generic-api-key 抓到 ✓
#   Credentials("1//0xxxx…")          → 一筆都沒有 ✗
#
# 而後者正是 2024 年那次的形狀：憑證<b>寫死在 legacy/app.py 的程式碼裡</b>，
# 沒有任何 `XXX_TOKEN=` 可以當線索。下面兩條靠的是固定前綴（`1//`、`GOCSPX-`），
# 不依賴上下文，所以那個縫補得起來。
#
# ⚠️ 測這件事有個陷阱，踩過一次：用 `AbCdEfGh…` 這種手打的假憑證去測，
# 會被 gitleaks 預設的 stopword 白名單吃掉，得到一個「安全」的假結論。
# 要用真正隨機的字串測，否則驗的是白名單而不是規則。
#
# 🔴 **client id 刻意不設規則**：它在 OAuth 流程裡本來就會出現在使用者的瀏覽器上，
# 設計上就是公開的。把不是祕密的東西也標成祕密，只會讓人習慣性忽略告警——
# 而那會連真的那兩條一起忽略掉。
[[rules]]
id = "google-oauth-refresh-token"
description = "Google OAuth Refresh Token"
# 特徵：固定前綴 1// 之後接一長串 base64url。
regex = '''1//[0-9A-Za-z\-_]{50,}'''
tags = ["google", "oauth", "token"]

[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth Client Secret"
# 特徵：固定前綴 GOCSPX- 之後 28 個字元。
regex = '''GOCSPX-[0-9A-Za-z\-_]{28}'''
tags = ["google", "oauth", "secret"]

# ── 本機開發用的佔位值 ────────────────────────────────────────────────
# docker-compose 與 application.yml 的預設值刻意寫成 svra-dev-only，
# 讓人一眼看出「這不是真憑證」；正式環境一律由環境變數覆蓋。
[[allowlists]]
description = "本機開發的佔位密碼，非真實憑證"
regexes = [
  '''svra-dev-only''',
]

# ── 測試用的簽章 fixture ──────────────────────────────────────────────
# 驗簽測試裡的預期值是 HMAC-SHA256 的**輸出**，不是憑證：
#
#   printf '%s' '{"events":[]}' | openssl dgst -sha256 -hmac 'test-secret' -binary | base64
#
# 金鑰（test-secret）與輸入（{"events":[]}）都明寫在同一個檔案裡，
# 任何人都能重算，它不通往任何東西。這是密碼學實作的標準測法（known-answer test）——
# 期望值由外部工具算出，才不會變成拿自己驗自己。
#
# ⚠️ 這條白名單一度指向 core/src/test/java/io/svra/**line**/LineWebhookControllerTest.java，
# 而那個檔案早就搬到 webhook/、簽章 fixture 也搬到 security/。也就是說它已經失效了一段時間，
# 而掃描之所以沒響，是因為 gitleaks 的預設規則需要關鍵字前後文才會抓 44 字元的 base64——
# **是規則沒抓到，不是白名單放行**。白名單的路徑會隨重構失效而且不會有人通知，
# 所以這裡改成鎖檔名而不是完整路徑。
[[allowlists]]
description = "驗簽測試的 HMAC 預期值（known-answer test 的輸出，非憑證）"
paths = [
  '''core/src/test/java/io/svra/security/LineSignatureTest\.java''',
  '''core/src/test/java/io/svra/security/WebhookSecurityTest\.java''',
]

# ── 測試用的加密 fixture（決策 32 帶進來的） ─────────────────────────
# 兩個值，都不通往任何東西：
#
#   c3ZyYS10ZXN0LWtleS1kby1ub3QtdXNlLWluLXByb2Q=
#     → base64 解出來是 "svra-test-key-do-not-use-in-prod"。
#       它是一句話，不是隨機值——刻意這樣選，就是為了讓看到的人一眼確定它是假的。
#
#   1//0abcdefghijklmnop
#     → SecretCipherTest 用來驗加解密來回的假 token。**保留真實的形狀是有價值的**：
#       它讓讀測試的人看得出這裡保護的到底是什麼東西。
#
# 🔴 用「值」而不是「路徑」放行，是刻意的。整批放行 core/src/test/ 的話，
# 哪天有人把真憑證貼進某支測試，掃描會安靜地放過去——**而測試檔跟正式碼一樣會進 git**。
# 鎖成兩個字面值，新的假憑證就必須自己來這裡登記一次。
#
# （上一條白名單的教訓也在同一個方向：鎖完整路徑會隨重構失效，而且不會有人通知。）
[[allowlists]]
description = "加密測試的假金鑰與假 token（不通往任何服務）"
regexes = [
  '''c3ZyYS10ZXN0LWtleS1kby1ub3QtdXNlLWluLXByb2Q=''',
  '''1//0abcdefghijklmnop''',
]
