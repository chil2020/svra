logging:
  pattern:
    # 欄位：時間 / 級別 / [關聯 ID] / 執行緒 / 類別 / 訊息
    #
    #   Asia/Taipei 寫死：容器沒設 TZ，JVM 預設會是 UTC，log 時間跟牆上的時鐘差 8 小時。
    #   %-18X{messageId} 只設下限不設上限：截斷過的 id 就 grep 不到（見 io.svra.LogContext）。
    #   .-11thread 從後面截：http-nio-8443-exec-1 從前面截每條都一樣。
    #   %replace 留 logger 最後兩段：outbox.OutboxPoller、tomcat.TomcatWebServer。
    console: "%d{HH:mm:ss.SSS, Asia/Taipei} %-5level [%-18X{messageId:-}] %-11.-11thread %-30replace(%logger){'^.*?([^.]+\\.[^.]+)$','$1'} : %msg%n%wEx"
  level:
    # 想看某一層的細節時單獨打開，例如：
    #   LOGGING_LEVEL_IO_SVRA_OUTBOX=DEBUG ./run-core.sh
    io.svra: ${LOG_LEVEL_SVRA:INFO}

server:
  # 8080 太常被別的東西佔走，改用 8443（1024 以上不需要 root）
  port: ${SERVER_PORT:8443}

spring:
  application:
    name: svra-core
  task:
    scheduling:
      # 預設是 scheduling-1，改短一點讓 log 的執行緒欄好認。outbox poller 跑在這上面。
      thread-name-prefix: sched-
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/svra}
    username: ${POSTGRES_USER:svra}
    password: ${POSTGRES_PASSWORD:svra-dev-only}
  jpa:
    hibernate:
      ddl-auto: validate # schema 一律走 Flyway，JPA 只驗證
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:svra}
    password: ${RABBITMQ_PASSWORD:svra-dev-only}
    listener:
      simple:
        # 預設是 true：listener 一拋例外，訊息就回到佇列頭被立刻再收一次——
        # 沒有退避的忙迴圈，一則壞訊息可以卡住整條線。改成 false 之後
        # 重試耗盡的訊息會走 x-dead-letter-exchange 進 DLQ，由 DLQ listener 收尾。
        default-requeue-rejected: false
        retry:
          # 先在行程內退避重試（資料庫短暫抖動這類問題重試就會好），
          # 真的救不回來才進 DLQ。
          enabled: true
          # ⚠️ 這裡的 2 不是把重試調少了。Boot 4 把 max-attempts 換成 max-retries，
          # 而語意跟著換了：max-retries 算的是「初次之後再試幾次」，
          # 不含第一次。原本 max-attempts: 3（總共送 3 次）＝ 現在 max-retries: 2。
          max-retries: 2
          initial-interval: 2s
          multiplier: 2
          max-interval: 30s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

management:
  server:
    # 🔴 actuator 不跟 webhook 共用埠。
    # 8443 是 ngrok 對外的那個埠，而 /actuator/prometheus 會吐出 JVM、
    # 連線池、HTTP 路由等內部細節。保護它靠的是「不在對外的埠上」，
    # 不是密碼——決策 20 的理由沒有變。
    #
    # 但 8444 不會因為換了埠就自動豁免 Spring Security：決策 22 之後，
    # Boot 的 ServletManagementChildContextConfiguration 會把父 context 的
    # springSecurityFilterChain 也註冊進 management 子 context。
    # SecurityConfig 因此顯式給了 actuator 一條 permitAll 的 chain——
    # 拿掉它，Prometheus 會靜靜地抓不到，啟動時完全沒有徵兆。
    port: ${MANAGEMENT_PORT:8444}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

svra:
  line:
    channel-secret: ${LINE_CHANNEL_SECRET:}
    channel-access-token: ${LINE_CHANNEL_ACCESS_TOKEN:}
  # 相對路徑依啟動目錄而定；與 worker 共用時建議用絕對路徑或設 AUDIO_DIR
  audio-dir: ${AUDIO_DIR:./data/audio}
  outbox:
    poll-interval-ms: 2000
  llm:
    # 同一段逐字稿重抽不必再打模型一次。地端沒有金錢成本，但一次抽取 12 秒起跳，
    # 而 eval 與重跑都會一再送進同樣的輸入。
    cache-ttl: 24h
    # 地端 Ollama 只有一份，同時湧進來的請求會互相搶 CPU。這不是省錢，是保護
    # 唯一那個推論資源。
    rate-limit: 30
    rate-limit-window: 1m
  calendar:
    # 🔴 誰可以讓後端「直接」寫進他的行事曆（決策 27）。
    #
    # 空的＝所有人走預填連結：不需要 OAuth、不受 Google 的 100 人終身上限與
    # 4-6 週審核限制，下面四個憑證也可以整個留白。
    # 有人＝那些人的卡片會長出 postback 按鈕（一鍵整批 + 改了會連動），
    # 而此時憑證沒填齊會**啟動失敗**——因為那個組合一定是壞的。
    #
    # 逗號分隔，例如 CALENDAR_OAUTH_USER_IDS=U4af4980629,U0123456789
    oauth-user-ids: ${CALENDAR_OAUTH_USER_IDS:}
    # GCP → APIs & Services → Credentials，建一個「Desktop app」類型的 OAuth client。
    # 🔴 consent screen 一定要按 Publish app 切到 In Production：
    #    停在 Testing 的話 Google 會在七天後撤銷 refresh token（見決策 26）。
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # 由 deploy/google-calendar-auth.py 一次性取得，跑一次就好
    refresh-token: ${GOOGLE_REFRESH_TOKEN:}
    # 專用子行事曆，同一支腳本會建立並印出它的 id。
    # 不用 primary：機器產生的事件跟手建的行程混在一起，抽錯時就沒有「整層關掉」這個選項。
    calendar-id: ${GOOGLE_CALENDAR_ID:}
    # 使用者講了幾點、但沒講多久時的長度。不讓模型猜——「開會多久」幾乎沒有人會講。
    # 兩條路共用：同一筆行程不該因為使用者有沒有授權就變成不同長度的事件。
    default-duration-minutes: ${CALENDAR_DEFAULT_DURATION_MINUTES:60}
  # 佇列名稱需與 whisper-worker/main.py 的 topology 一致
  mq:
    exchange: svra.direct
    dlx: svra.dlx
    job-queue: transcribe.jobs
    job-routing-key: transcribe.job
    job-dlq: transcribe.jobs.dlq
    result-queue: transcribe.results
    result-routing-key: transcribe.result
    result-dlq: transcribe.results.dlq

# Spring AI。地端 Ollama——換供應商只要換 starter 與這一段，
# ChatClient 的呼叫端不用改。
spring.ai:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    init:
      pull-model-strategy: never   # 模型由 `ollama pull` 管，不讓應用程式自己抓
    chat:
      # Qwen3.5 是思考模型，預設會思考——這個任務只要結構化輸出，
      # 思考讓一次抽取從 12 秒變成 200 秒以上，而且 content 有時是空的。
      think: FALSE
      options:
        model: ${OLLAMA_MODEL:qwen3.5:9b}
        temperature: 0.0   # 抽取任務要可重現，不要創意
