name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build core
        run: mvn -B -ntp package --file core/pom.xml

  whisper-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: whisper-worker/requirements.txt
      - name: Install deps
        run: pip install -r whisper-worker/requirements.txt
      - name: Compile check
        run: python -m compileall whisper-worker
