name: CI

on:
  push:
  pull_request:

jobs:
  # 2026/08：GitGuardian 通報 2024 年的 app.py 有 LINE token 與 memos JWT 外洩。
  # 處置順序刻意是「先撤銷憑證止血 → 再加防線」，因為已公開的字串靠清 code 收不回來。
  # 這一關掃全歷史，避免同樣的事再發生。
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks 要掃完整歷史，不能只拿最新一版
      # 直接跑執行檔而不用 gitleaks-action：版本可以釘死，
      # CI 的結果才會跟本機 `gitleaks detect` 完全一致。
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # detect 掃的是「版控歷史」，這才是會外洩出去的東西。
      # 掃工作目錄（--no-git）會連 .gitignore 的檔案一起掃，
      # 本機的 .env 會被誤報 —— 兩種掃法測的是不同的事。
      - name: Scan for hardcoded secrets
        run: gitleaks detect --config .gitleaks.toml --redact --no-banner --verbose

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # 整合測試會用 Testcontainers 起 PostgreSQL，GitHub 的 ubuntu runner 內建 Docker。
      # 這一步同時補上決策 8 的破口：ddl-auto=validate 只在「應用真的啟動」時才驗
      # entity 與 migration 是否一致，而在有這些測試之前，CI 從來沒有啟動過應用——
      # migration 跟 entity 漂掉了要等本機跑起來才會發現。
      - name: Build core
        run: mvn -B -ntp package --file core/pom.xml

  whisper-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: whisper-worker/requirements.txt
      - name: Install deps
        run: pip install -r whisper-worker/requirements.txt
      # -x 排掉 .venv：那是宿主機跑 MLX 用的虛擬環境（見 eval/README.md），
      # 不進版控，但本機跑這行時會掃到它，而裡面的套件不保證能被當前的
      # Python 版本編譯。CI 上沒有它，加這個參數是為了讓本機跑同一行也會過。
      - name: Compile check
        run: python -m compileall -q -x '\.venv' whisper-worker
      # eval 的量尺自己要先是對的。它算錯的話產出的是「有自信的錯誤數字」，
      # 而那比沒有數字更危險——沒有人會去質疑一個看起來很篤定的表格。
      - name: Eval instrument self-test
        run: python whisper-worker/scripts/test_eval_asr.py
