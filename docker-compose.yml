name: svra

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-svra}
      POSTGRES_USER: ${POSTGRES_USER:-svra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-svra-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-svra} -d ${POSTGRES_DB:-svra}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-svra}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-svra-dev-only}
    ports:
      - "5672:5672"
      - "15672:15672" # 管理介面 http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  whisper-worker:
    build: ./whisper-worker
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-svra}:${RABBITMQ_PASSWORD:-svra-dev-only}@rabbitmq:5672/
      WHISPER_MODEL: ${WHISPER_MODEL:-phate334/Breeze-ASR-25-ct2}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    volumes:
      - ./data/audio:/data/audio          # core 與 worker 交換音檔的共享目錄
      - whisper-models:/root/.cache/huggingface # 模型權重快取，避免每次重載
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ── core（Spring Boot）────────────────────────────────────────────
  # 第 1 週開發期建議直接在本機 `cd core && mvn spring-boot:run`
  # （application.yml 的預設值已指向 localhost 的三個基礎服務）。
  # 要容器化時補上 core/Dockerfile 再解開下面註解：
  #
  # core:
  #   build: ./core
  #   env_file: .env
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ./data/audio:/data/audio
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  pgdata:
  rabbitmq-data:
  whisper-models:
