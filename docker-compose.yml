name: svra

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-svra}
      POSTGRES_USER: ${POSTGRES_USER:-svra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-svra-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-svra} -d ${POSTGRES_DB:-svra}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 🔴 基礎服務的 restart policy 比 depends_on 更關鍵。
    # depends_on 只在「執行 docker compose up」那一刻生效；重開機時是 daemon
    # 依各容器自己的 policy 把它們叫醒，daemon 不讀 compose 檔，不看 depends_on。
    # 這三個原本沒有 policy，重開機後停在 exited，而有 unless-stopped 的
    # core／worker 自己回來了卻連不到它們——UnknownHostException: postgres。
    #
    # 所以順序不是「調」出來的，是兩件事湊出來的：依賴一定會回來（這行），
    # 依賴者要等得起（core 的 flyway connect-retries、worker 的重連迴圈）。
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-svra}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-svra-dev-only}
    ports:
      - "5672:5672"
      - "15672:15672" # 管理介面 http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped   # 同上：重開機後要自己回來，否則 worker 空轉

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped   # 同上

  whisper-worker:
    build: ./whisper-worker
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-svra}:${RABBITMQ_PASSWORD:-svra-dev-only}@rabbitmq:5672/
      WHISPER_MODEL: ${WHISPER_MODEL:-phate334/Breeze-ASR-25-ct2}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      # 轉錄成功後刪音檔：逐字稿已進資料庫，留著只會讓語音資料無上限堆積
      WHISPER_DELETE_AUDIO: ${WHISPER_DELETE_AUDIO:-true}
    volumes:
      - ./data/audio:/data/audio          # core 與 worker 交換音檔的共享目錄
      - whisper-models:/root/.cache/huggingface # 模型權重快取，避免每次重載
      - ./eval:/eval:ro                   # ASR eval 的案例檔（唯讀，worker 不該寫它）
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # worker 連不上 rabbitmq 時不會死，它會退避重連（重開機時 rabbitmq 一定
      # 比它晚起，那是對的）。代價是容器狀態永遠是 Up——少了這一關，一個打錯的
      # host 名字就是一個看起來很健康的無限迴圈。這裡讓 Up 重新代表「真的在消費」。
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      # rabbitmq 起來得比 worker 慢是正常的，不該在那段期間就判它 unhealthy
      start_period: 90s
    restart: unless-stopped

  core:
    build: ./core
    # 開發時 core 通常跑在本機（改一行不用重建映像檔），所以放進 profile：
    #   docker compose up -d                  只起基礎服務
    #   docker compose --profile full up -d   連 core 一起
    profiles: ["full"]
    # .env 提供 LINE 憑證與 postgres/rabbitmq 帳密；
    # 下面的 environment 覆蓋掉那些「本機開發用 localhost」的預設值——
    # 在容器裡 localhost 是容器自己，要走 compose 的服務名。
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-svra}
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      AUDIO_DIR: /data/audio
      MANAGEMENT_PORT: 8444
      # Ollama 跑在宿主機不是容器裡（模型權重大、要用 Metal 加速）
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      # 只發布 webhook 的埠。actuator 在 8444，刻意不對外——
      # 要看指標就 docker compose exec 進去，或另外接監控網路。
      - "8443:8443"
    volumes:
      - ./data/audio:/data/audio          # 與 whisper-worker 交換音檔
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux 上沒有這行會找不到宿主機
    # 這段只管 `docker compose up`：那時 core 會等三個依賴都 healthy 才起。
    # 重開機那條路徑不吃這裡（見 postgres 的註解），core 得靠自己等——
    # 交給 application.yml 的 spring.flyway.connect-retries。
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8444/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s     # Spring Boot 冷啟動要一段時間，太短會被誤判成掛掉
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq-data:
  whisper-models:
